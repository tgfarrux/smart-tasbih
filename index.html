<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Tasbih</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #00f2fe;
        }

        body {
            background: var(--bg-gradient);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.8);
        }

        /* Asosiy doira dizayni */
        .tasbih-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .glass-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s;
        }

        /* Bosgandagi animatsiya */
        .tasbih-wrapper:active .glass-circle, 
        .tasbih-wrapper.animating .glass-circle {
            transform: scale(0.92);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
            border-color: rgba(0, 242, 254, 0.5);
        }

        #count {
            font-size: 72px;
            font-weight: 700;
            z-index: 2;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,242,254,0.2);
            transition: transform 0.1s;
        }

        /* Tugmalar paneli */
        .controls {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 90%;
            z-index: 2;
        }

        button {
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: translateY(2px);
            background: rgba(255,255,255,0.1);
        }

        #resetBtn { border-color: rgba(255, 89, 94, 0.4); }
        #voiceBtn { border-color: rgba(138, 201, 38, 0.4); }
        #sensorBtn { border-color: rgba(25, 130, 196, 0.4); }

        #status {
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 8px 20px;
            border-radius: 20px;
        }

        /* SVG Animatsiya */
        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .ring circle {
            fill: none;
            stroke: url(#grad);
            stroke-width: 4;
            stroke-dasharray: 750;
            stroke-dashoffset: 750;
            transition: stroke-dashoffset 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div class="header">Zikr</div>

    <div class="tasbih-wrapper" id="tasbihBtn">
        <svg class="ring" viewBox="0 0 250 250">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#4facfe" />
                    <stop offset="100%" stop-color="#00f2fe" />
                </linearGradient>
            </defs>
            <circle cx="125" cy="125" r="120" id="progressCircle"></circle>
        </svg>
        <div class="glass-circle"></div>
        <div id="count">0</div>
    </div>

    <div class="controls">
        <button id="resetBtn">🔄 Nolga</button>
        <button id="voiceBtn">🎤 Ovoz</button>
        <button id="sensorBtn">📱 Harakat</button>
    </div>
    
    <div id="status">Ekranni suring, silkiting yoki bosing.</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#0f2027'); 
        tg.setBackgroundColor('#0f2027');

        let count = 0;
        const countDisplay = document.getElementById('count');
        const tasbihBtn = document.getElementById('tasbihBtn');
        const statusDisplay = document.getElementById('status');
        const progressCircle = document.getElementById('progressCircle');
        
        const circleLength = 750; // SVG circle length

        function incrementCounter(source) {
            count++;
            countDisplay.innerText = count;
            
            // Animatsiya qo'shish
            tasbihBtn.classList.add('animating');
            setTimeout(() => tasbihBtn.classList.remove('animating'), 150);

            // Progress bar (33 ta zikr uchun bitta to'la aylana)
            let progress = (count % 33) / 33;
            if(count % 33 === 0) progress = 1; // 33 da to'ladi
            progressCircle.style.strokeDashoffset = circleLength - (circleLength * progress);

            // Telegram haptic feedback
            if (tg.HapticFeedback) {
                if (count % 33 === 0) {
                    tg.HapticFeedback.notificationOccurred('success'); // 33 tasida uzun vibratsiya
                } else {
                    tg.HapticFeedback.impactOccurred('light'); // Oddiy bosganda qisqa vibratsiya
                }
            }

            statusDisplay.innerText = `${source} orqali`;
        }

        // Asosiy tugmaga bosish
        tasbihBtn.addEventListener('click', () => incrementCounter('Tegish'));

        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            count = 0;
            countDisplay.innerText = count;
            progressCircle.style.strokeDashoffset = circleLength;
            tg.HapticFeedback.impactOccurred('heavy');
        });

        // Swipe
        let touchStartY = 0;
        document.body.addEventListener('touchstart', (e) => {
            touchStartY = e.changedTouches[0].screenY;
        });
        document.body.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].screenY;
            if (Math.abs(touchEndY - touchStartY) > 50) {
                incrementCounter('Surish');
            }
        });

        // Sensorlar (Shake & Back tap)
        document.getElementById('sensorBtn').addEventListener('click', () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') startMotionSensors();
                    }).catch(console.error);
            } else {
                startMotionSensors();
            }
            document.getElementById('sensorBtn').style.opacity = '0.5';
        });

        let lastShakeTime = 0;
        function startMotionSensors() {
            window.addEventListener('devicemotion', (e) => {
                let acc = e.acceleration || e.accelerationIncludingGravity;
                if (!acc) return;
                let currentTime = new Date().getTime();
                if ((currentTime - lastShakeTime) > 300) {
                    if (Math.abs(acc.z) > 12) {
                        incrementCounter('Orqaga chertish');
                        lastShakeTime = currentTime;
                    } else if (Math.abs(acc.x) > 15 || Math.abs(acc.y) > 15) {
                        incrementCounter('Silkitish');
                        lastShakeTime = currentTime;
                    }
                }
            });
            statusDisplay.innerText = "Harakat datchigi faol";
        }

        // Voice API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'uz-UZ';
            document.getElementById('voiceBtn').addEventListener('click', () => {
                try {
                    recognition.start();
                    document.getElementById('voiceBtn').innerHTML = '🔴 Eshitilmoqda';
                    document.getElementById('voiceBtn').style.borderColor = '#ff595e';
                } catch(e) { recognition.stop(); }
            });
            recognition.onresult = (event) => {
                const text = event.results[event.results.length - 1][0].transcript;
                if(text.trim().length > 0) incrementCounter('Ovoz');
            };
        } else {
            document.getElementById('voiceBtn').style.display = 'none';
        }

        // Volume keys (agar qurilma ruxsat bersa)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'AudioVolumeUp' || e.key === 'AudioVolumeDown') {
                incrementCounter('Tugma');
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
